spring:
  application:
    name: freshvend-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/freshvend_db}
    username: ${DB_USERNAME:freshvend_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
