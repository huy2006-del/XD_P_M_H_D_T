# Connect Docker Databse
spring.datasource.url=jdbc:postgresql://localhost:5433/freshvend_db
spring.datasource.username=freshvend_user
spring.datasource.password=freshvend_secret_password
spring.datasource.driver-class-name=org.postgresql.Driver
  
# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true