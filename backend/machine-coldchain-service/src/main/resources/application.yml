server:
  port: ${SERVER_PORT:8083}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: machine-coldchain-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/freshvend_machine_db}
    username: ${DB_USERNAME:freshvend_user}
    password: ${DB_PASSWORD:freshvend_secret_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
