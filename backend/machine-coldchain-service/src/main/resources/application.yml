server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: machine-coldchain-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/freshvend_machine}
    username: ${DB_USERNAME:freshvend_user}
    password: ${DB_PASSWORD:freshvend_secret_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
