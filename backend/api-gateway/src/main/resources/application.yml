server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: http://localhost:5173
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: machine-websocket
          uri: lb:ws://machine-coldchain-service
          predicates:
            - Path=/ws/**
        - id: inventory-slot-stock
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/slots/*/inventory,/api/v1/slots/*/batches,/api/v1/slots/*/dispense
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/batches/**,/uploads/products/**
        - id: machine-coldchain-service
          uri: lb://machine-coldchain-service
          predicates:
            - Path=/api/v1/machines/**,/api/v1/locations/**,/api/v1/slots/**,/api/v1/simulator/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
