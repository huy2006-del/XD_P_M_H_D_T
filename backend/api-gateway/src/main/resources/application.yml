server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: machine-websocket
          uri: lb:ws://machine-coldchain-service
          predicates:
            - Path=/ws-freshvend/**

        - id: inventory-slot-stock
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/slots/*/inventory,/api/v1/slots/*/batches,/api/v1/slots/*/dispense

        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/audit-logs/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/batches/**,/uploads/products/**,/api/v1/restock-sessions/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/analytics/**,/api/v1/reports/**

        - id: machine-coldchain-service
          uri: lb://machine-coldchain-service
          predicates:
            - Path=/api/v1/machines/**,/api/v1/locations/**,/api/v1/slots/**,/api/v1/simulator/**,/api/v1/alerts/**,/api/v1/thresholds/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:FreshVendSuperSecretKeyForJWTSignatureVerification2026MustBe256Bits!}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:FV_INTERNAL_GATEWAY_SECRET_2026}