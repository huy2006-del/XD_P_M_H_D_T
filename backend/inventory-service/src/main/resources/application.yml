server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/freshvend_inventory}
    username: ${DB_USERNAME:freshvend_user}
    password: ${DB_PASSWORD:freshvend_secret_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

rabbitmq:
  exchange:
    order: freshvend.order.exchange
  routing:
    key:
      paid: order.paid

vietqr:
  bank-id: MB
  account-no: "0000000000"
  account-name: FRESHVEND