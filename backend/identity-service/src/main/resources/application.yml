server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/freshvend_identity}
    username: ${DB_USERNAME:freshvend_user}
    password: ${DB_PASSWORD:freshvend_secret_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:FreshVendSuperSecretKeyForJWTSignatureVerification2026MustBe256Bits!}
  expiration: ${JWT_EXPIRATION:86400000}

internal:
  gateway:
    secret: ${INTERNAL_GATEWAY_SECRET:FV_INTERNAL_GATEWAY_SECRET_2026}