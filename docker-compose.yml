services:
  postgres:
    image: postgres:15-alpine
    container_name: freshvend_postgres
    restart: always
    environment:
      POSTGRES_USER: freshvend_user
      POSTGRES_PASSWORD: freshvend_secret_password
      POSTGRES_DB: freshvend_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql