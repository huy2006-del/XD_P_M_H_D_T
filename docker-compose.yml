name: freshvend

services:
  postgres:
    image: postgres:15-alpine
    container_name: freshvend_postgres
    restart: always
    environment:
      POSTGRES_USER: freshvend_user
      POSTGRES_PASSWORD: freshvend_secret_password
      POSTGRES_DB: freshvend_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: freshvend_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: